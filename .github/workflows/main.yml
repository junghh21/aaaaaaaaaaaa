name: Run Every 5 Minutes

on:
  repository_dispatch:
    types: [external-cron]
  schedule:
    - cron: '0 16 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:         # 수동 실행도 가능하게 추가

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print timestamp
        run: echo "Workflow triggered at $(date -u)"
